name: Build and Release ztOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ztOS Images & Publish Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            dosfstools \
            e2fsprogs \
            flex \
            libarchive-tools \
            libelf-dev \
            libssl-dev \
            mtools \
            qemu-user-static \
            binfmt-support \
            util-linux \
            xz-utils \
            zstd \
            curl \
            python3

      - name: Set up QEMU ARM64 binfmt
        run: |
          sudo systemctl restart systemd-binfmt.service || true
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 || true

      - name: Build ztOS for Samsung Galaxy S9 (starlte)
        run: |
          echo "=== Building S9 (starlte) rootfs ==="
          python3 installer/ztos build --target starlte --user zerone --password toor --hostname ztos --timezone UTC
          echo "=== Building S9 (starlte) boot image ==="
          ./scripts/build-boot.sh ztos-boot --fallback recovery --power --touch --cpufreq --gpu --decon --wlan

      - name: Build ztOS for QEMU Emulator (qemu)
        run: |
          echo "=== Building QEMU disk image ==="
          python3 installer/ztos build --target qemu --user zerone --password toor --hostname ztos --timezone UTC

      - name: Package and compress release assets
        run: |
          mkdir -p release-assets

          echo "=== Packaging S9 (starlte) ==="
          cp out/ztos-boot.img release-assets/ztos-starlte-boot.img
          zstd -T0 -15 build/ztos/starlte/root.img -o release-assets/ztos-starlte-root.img.zst
          xz -T0 -9 -k build/ztos/starlte/root.img
          mv build/ztos/starlte/root.img.xz release-assets/ztos-starlte-root.img.xz

          echo "=== Packaging QEMU Emulator ==="
          zstd -T0 -15 build/ztos/qemu/ztos-qemu.img -o release-assets/ztos-qemu.img.zst
          xz -T0 -9 -k build/ztos/qemu/ztos-qemu.img
          mv build/ztos/qemu/ztos-qemu.img.xz release-assets/ztos-qemu.img.xz

          echo "=== Calculating SHA256 checksums ==="
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Determine tag name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ztOS ${{ steps.vars.outputs.tag }}
          body: |
            ## ztOS Release ${{ steps.vars.outputs.tag }}
            
            Official prebuilt system and boot images for ztOS Mobile.
            
            ### Default Credentials:
            * **Username:** `zerone`
            * **Password:** `toor`
            * **Sudo:** `zerone` has full sudo privileges (`toor`).
            
            ---
            
            ### Included Packages & Separate Target Images:
            
            #### 1. Samsung Galaxy S9 (starlte)
            * **`ztos-starlte-boot.img`**: Mainline 7.1 Linux kernel boot image for `BOOT` partition.
            * **`ztos-starlte-root.img.zst` / `.xz`**: Full 10 GB Arch Linux ARM rootfs with ztMETRO shell and native apps.
            
            #### 2. QEMU PC Emulator (ARM64 virt)
            * **`ztos-qemu.img.zst` / `.xz`**: Preconfigured GPT disk image with EFI bootloader, ready to boot via `installer/ztos emulator`.
            
            #### Checksums:
            * **`SHA256SUMS.txt`**: Verification hashes for all assets.
            
            ---
            
            ### Quick Installation:
            Run `installer/ztos install` and choose **1. Auto Download Prebuilt image and install**.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
